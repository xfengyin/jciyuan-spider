# Release 工作流：推送 v* 标签时构建三端二进制，压缩后发布到 GitHub Release。
# 采用 go build 矩阵（不依赖 GoReleaser），权限最小化（仅 contents: write）。
name: Release

on:
  push:
    tags:
      - "v*" # 例如 v0.1.0、v1.2.3-beta.1

permissions:
  contents: write # 仅用于创建 Release 与上传资源

# runner 只配了单个 goproxy.cn，偶发 TLS handshake timeout 会让整个 job 失败
# （2026-10-10 实测 run#950：Download dependencies 16s 即挂）。加兜底，go 会顺次尝试。
env:
  GOPROXY: https://goproxy.cn,https://mirrors.aliyun.com/goproxy/,https://goproxy.io,direct
  GOSUMDB: sum.golang.google.cn
jobs:
  build:
    timeout-minutes: 90  # 防挂死：实测本 Gitea 会执行这个上限（orangepi task1126 在 60.1 分钟被切断并 FAIL）
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: darwin
            arch: arm64
            ext: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25" # 与 go.mod 保持一致
          cache: ${{ github.server_url == 'https://github.com' }}

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o dist/jciyuan-spider-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .

      - name: Compress artifact
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -q jciyuan-spider-${{ matrix.os }}-${{ matrix.arch }}.zip \
              jciyuan-spider-${{ matrix.os }}-${{ matrix.arch }}.exe
          else
            tar -czf jciyuan-spider-${{ matrix.os }}-${{ matrix.arch }}.tar.gz \
              jciyuan-spider-${{ matrix.os }}-${{ matrix.arch }}
          fi

      - name: Upload build artifacts (Gitea)
        if: github.server_url != 'https://github.com'
        uses: actions/upload-artifact@v3
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 3

      - name: Upload build artifacts (GitHub)
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 3

  release:
    timeout-minutes: 90  # 防挂死：实测本 Gitea 会执行这个上限（orangepi task1126 在 60.1 分钟被切断并 FAIL）
    name: Create GitHub Release
    needs: build
    # 只有 NAS runner 配了 github_mirror；落到 1.4G 的 Pi 上连 action 都拉不下来（实测 task 1074 7s 即败）
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'amd64' }}
    steps:
      - name: Download build artifacts (Gitea)
        if: github.server_url != 'https://github.com'
        uses: actions/download-artifact@v3
        with:
          path: dist/
          merge-multiple: true

      - name: Download build artifacts (GitHub)
        if: github.server_url == 'https://github.com'
        uses: actions/download-artifact@v7
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
