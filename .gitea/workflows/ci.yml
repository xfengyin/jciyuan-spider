# CI 工作流：在 PR 与 main 分支推送时执行构建、静态检查与单元测试
name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

# runner 只配了单个 goproxy.cn，偶发 TLS handshake timeout 会让整个 job 失败
# （2026-10-10 实测 run#950：Download dependencies 16s 即挂）。加兜底，go 会顺次尝试。
env:
  GOPROXY: https://goproxy.cn,https://mirrors.aliyun.com/goproxy/,https://goproxy.io,direct
  GOSUMDB: sum.golang.google.cn
# 同一分支的新 run 直接取代旧的：本机只有 2 个 runner 槽位，重复排队会重复跑完整构建
# （picoclaw 一次 build-all 实测 30+ 分钟）。cancel-in-progress 用 false 时只要有一个 run
# 卡住，整个并发组会被永久毒死（2026-10-09 在 mimiclaw-orangepi 上踩过）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-build-test:
    name: Lint / Build / Test
    runs-on: amd64
    strategy:
      matrix:
        # 与 go.mod 保持一致，避免工具链自动降级/升级带来的不确定性
        go-version: ["1.25"]

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v5

      # 设置 Go 环境
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: ${{ github.server_url == 'https://github.com' }}

      # 下载依赖
      - name: Download dependencies
        run: go mod download

      # 静态检查
      - name: Run go vet
        run: go vet ./...

      # 构建全部包（框架包 crawler/、examples/ 示例与根 CLI 的编译校验）
      - name: Build all packages
        run: go build ./...

      # 构建全平台（测试交叉编译能力，关闭 CGO 以保持与 Release 一致）
      - name: Build all platforms
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux   GOARCH=amd64 go build -o dist/jciyuan-spider-linux-amd64   .
          GOOS=darwin  GOARCH=amd64 go build -o dist/jciyuan-spider-darwin-amd64  .
          GOOS=windows GOARCH=amd64 go build -o dist/jciyuan-spider-windows-amd64.exe .

      # 单元测试
      - name: Run unit tests
        run: go test -race -cover ./...

      # 上传构建产物（便于调试）
      - name: Upload build artifacts (Gitea)
        if: github.server_url != 'https://github.com'
        uses: actions/upload-artifact@v3
        with:
          name: binaries-${{ matrix.go-version }}
          path: dist/*
          retention-days: 3

      - name: Upload build artifacts (GitHub)
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.go-version }}
          path: dist/*
          retention-days: 3
