# Release 工作流：推送 v* 标签时构建三端二进制，压缩后发布到 GitHub Release。
# 采用 go build 矩阵（不依赖 GoReleaser），权限最小化（仅 contents: write）。
name: Release

on:
  push:
    tags:
      - "v*" # 例如 v0.1.0、v1.2.3-beta.1

permissions:
  contents: write # 仅用于创建 Release 与上传资源

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"
          - os: darwin
            arch: arm64
            ext: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25" # 与 go.mod 保持一致
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o dist/jciyuan-spider-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} .

      - name: Compress artifact
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -q jciyuan-spider-${{ matrix.os }}-${{ matrix.arch }}.zip \
              jciyuan-spider-${{ matrix.os }}-${{ matrix.arch }}.exe
          else
            tar -czf jciyuan-spider-${{ matrix.os }}-${{ matrix.arch }}.tar.gz \
              jciyuan-spider-${{ matrix.os }}-${{ matrix.arch }}
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          retention-days: 3

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
